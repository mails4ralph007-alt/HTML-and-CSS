<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="queries.css">

    <title>Register</title>

    <link rel="icon" type="image/svg" href="images/quill.svg">
</head>

<body>

    <div class="container">

        <header>

            <nav class="navbar">
                <a class="beta" href="register.html"><img class="logo-md" src="images/quill.svg" alt="quill logo"></a>

                <ul class="nav-btn-container">
                    <li><a class="btn btn-primary-outline" href="login.html">LOGIN</a></li>
                    <li><a class="btn btn-primary" href="index.html">HOME</a></li>
                </ul>
            </nav>

        </header>

        <main>


            <!-- HERO SECTION -->

            <div class="hero-heading-align-center">
                <h1 class="hero-heading highlight-primary shadow">Register</h1>
            </div>

            <form action="database" method="post">

                <div class="user-info-container">


                    <div class="user-info-inputs">

                        <h2 class="user-info-header highlight-secondary shadow">USER INFO</h2>

                        <div class="flex-start-inputs">


                            <div>
                                <label for="user_first_name" class="highlight-secondary shadow">First Name :</label>
                                <input type="text" id="user_first_name" name="user_first_name" placeholder="Raphael"
                                    required>
                            </div>

                            <br>

                            <div>
                                <label for="user_last_name" class="highlight-secondary-tint shadow">Last Name :</label>
                                <input type="text" id="user_last_name" name="user_last_name" placeholder="Achile"
                                    required>
                            </div>

                            <br>

                            <div>
                                <label for="phone" class="highlight-secondary-shade shadow">Phone Number :</label>
                                <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+123 456-7890"
                                    required>
                            </div>

                            <br>

                            <div>
                                <label for="user_email" class="highlight-tertiary shadow">Email Address :</label>
                                <input type="email" id="user_email" name="user_email" placeholder="name@example.com"
                                    required>
                            </div>

                        </div>

                    </div>

                </div>

                <div class="account-creation-container">

                    <div class="user-account-creation-inputs">

                        <h2 class="user-info-header highlight-primary shadow">ACCOUNT CREATION</h2>

                        <div class="flex-start-inputs">

                            <div>
                                <label for="username" class="highlight-primary shadow">User Name :</label>
                                <input type="text" id="username" name="username" required>
                            </div>

                            <br>

                            <div>
                                <label for="user_password" class="highlight-primary-tint shadow">Password :</label>
                                <input type="password" id="user_password" name="user_password" minlength="8"
                                    maxlength="15" placeholder="12345678910" required />
                            </div>

                            <br>

                            <div>
                                <label for="user_confirm_password" class="highlight-primary-shade shadow">Comfirm
                                    Password :</label>
                                <input type="password" id="user_confirm_password" name="user_confirm_password"
                                    minlength="8" maxlength="15" placeholder="12345678910" required />
                            </div>
                        </div>
                    </div>
                </div>
    </div>

    </div>

    <div class="sign-up-button-container">
        <a href="database" class="btn btn-primary">SIGN UP</a>
    </div>


    </form>


    <!-- FOOTER -->
    <footer class="footer">
        <a href="index.html"><img class="logo-sm" src="images/quill.svg" alt="quill logo"></a>
        <ul class="social-icons-container">
            <li><a href="https://www.instagram.com/"><img class="social-icons" src="images/instagram.svg"
                        alt="instagram logo"></a></li>
            <li><a href="https://www.facebook.com/"><img class="social-icons" src="images/facebook.svg"
                        alt="facebook logo"></a></li>
            <li><a href="https://www.tiktok.com/"><img class="social-icons" src="images/tiktok.svg"
                        alt="tiktok logo"></a></li>
            <li><a href="https://www.linkedin.com/"><img class="social-icons" src="images/linkedin.svg"
                        alt="linkedin logo"></a></li>
            <li><a href="https://www.youtube.com/"><img class="social-icons" src="images/youtube.svg"
                        alt="youtube logo"></a></li>
        </ul>
        <ul class="footer-links-container">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>

        <p class="small-text">Made with <span class="heart-icon">♥︎</span> in London</p>
    </footer>
    </main>

    </div>

</body>

</html>

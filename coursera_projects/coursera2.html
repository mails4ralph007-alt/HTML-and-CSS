<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Video Rating</title>

  <link rel="stylesheet" href="styles1.css">
</head>
<body>

  <div>

    <video width="320" height="240" controls>
      <source src="video.mp4" type="video/mp4">
      <source src="video.webm" type="video/webm">
      <source src="video.ogg" type="video/ogg">
    </video>

  </div>

  <form action="">

    <div>

      <label for="rating">Rate This Video</label>
      <input type="range" id="rating" name="rating" min="1" max="5">
      <div class="value-display">
            <span id="range-val">5</span>
          </div>
        </div>

        <script>
          const mySlider = document.getElementById('rating');
          const myVal = document.getElementById('range-val');

          mySlider.addEventListener('input', function () {
            myVal.textContent = this.value;
          });
        </script>


    </div>

    <div>

      <datalist id="rating">

        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>

      </datalist>

    </div>

    <button type="submit">Submit Rating</button>

  </form>
  
</body>

</html>
